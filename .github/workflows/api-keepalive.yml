name: CRM API keepalive

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-keepalive.yml'

permissions: {}

concurrency:
  group: crm-api-keepalive
  cancel-in-progress: true

jobs:
  warm-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_ROOT: 'https://vivotech1-001-site1.htempurl.com'
    steps:
      - name: Check API process and database
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in live ready; do
            status="$(curl --silent --show-error --fail \
              --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "${API_ROOT}/health/${endpoint}")"
            if [[ "$status" != '200' ]]; then
              echo "API health/${endpoint} returned HTTP ${status}"
              exit 1
            fi
            echo "API health/${endpoint}: OK"
          done
